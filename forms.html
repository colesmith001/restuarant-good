<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>
    <!-- text boxes -->
   <div> 
    <h1>HTML Forms</h1>
    <form action="" method="">
        <label for="fname">First name:</label>
        <input type="text" id="fname">
        <label for="lname">Last name:</label>
        <input type="text" id="lname">
        <input type="submit" value="submit">

    </form>
    <!-- radio type button -->
    
    <p>Choose your favorie code</p>
    <form>
        <label for="java">Java</label>
        <input type="radio" id="java" name="languages" value="Java">
    
        
            <label for="python">Python</label>
            <input type="radio" id="python" name="languages" value="Python">
            <label for="c_plus">C++</label>
            <input type="radio" id="c_plus" name="languages" value="C++">
            <input type="submit" value="submit">
        </form>
        <!-- checkbox -->
        <p>Select the option that applies to you:</p>
        <form>
            <input type="checkbox" id="vehichle1" value="bike">
            <label for="vehichle1"> I have a bike</label>
            <input type="checkbox" id="vehichle2" value="car">
            <label for="vehichle1"> I have a car</label>
            <input type="checkbox" id="vehichle3" value="boat">
            <label for="vehichle1"> I have a boat</label>
            <input type="submit" value="submit">
        </form>
        
        <!-- choose from multiple options -->
        <P>Elements inside of a form</P>
        <form>
            <fieldset>
                <legend>contact information</legend>
                <label for="fname">First name:</label>
                <input type="text" id="fname">
            </fieldset>
            <fieldset>
                <legend>vehichles</legend>
                <label for="cars">choose a car:</label>
                <select id="cars">
                    <option value="bmw">BMW</option>
                    <option value="toyota">Toyota</option>
                    <option value="ford">Ford</option>
                </select><br/>
            </fieldset>

            <!-- message box  -->
            <fieldset>
                <legend>body</legend>
                <label for="message">Leave message:</label>
                <textarea id="message" rows="20" cols="30"></textarea><br/>
            </fieldset>

            <!--  -->
            <fieldset>
                <legend>Input types</legend>
                <!-- password field -->
                <label for="password">Password:</label>
                <input type="password" id="password"><br/>
                <!-- color field -->
                <label for="favcolor">select your favorite color:</label>
                <input type="color" id="favcolor"><br/>
                <!-- date field -->
                <label for="birthday">birthday:</label>
                <input type="date" id="birthday"><br/>
                <!-- Email -->
                <label for="mail">email:</label>
                <input type="email" id="mail"><br/>
                <!-- File  -->
                <label for="myfile">Select a file:</label>
                <input type="file" id="myfile"><br/>
                <!-- age -->
                <label for="age">age:</label>
                <input type="number" id="age"><br/>
                
            </fieldset>
        </form>
    </div> 
</body>
</html>
